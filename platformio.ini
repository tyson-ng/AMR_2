[env:esp32dev]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

; Mở rộng bộ nhớ Flash lên 3MB cho micro-ROS
board_build.partitions = huge_app.csv 

; Bật giao thức truyền tải UDP qua Wi-Fi
board_microros_transport = wifi

; Liên kết thư viện tĩnh Kaia.ai micro-ROS
build_flags =
    -I .pio/libdeps/esp32dev/micro_ros_kaia/src
    -L .pio/libdeps/esp32dev/micro_ros_kaia/src/esp32
    -l microros
    -D ESP32

lib_deps = 
    madhephaestus/ESP32Encoder @ ^0.11.0
    https://github.com/kaiaai/LDS.git
    https://github.com/kaiaai/micro_ros_arduino_kaiaai.git